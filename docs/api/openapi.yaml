openapi: 3.0.3
info:
  title: Stock Simulator API
  version: v1
  description: API for the Stock Simulator paper-trading platform.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: Check API health
      responses:
        '200':
          description: API is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /auth/register:
    post:
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/login:
    post:
      summary: Log in and receive tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials
  /auth/me:
    get:
      summary: Get the authenticated user's safe profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Missing, invalid, expired, or non-access token
  /auth/refresh:
    post:
      summary: Rotate a refresh token and issue new tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens refreshed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid or revoked refresh token
  /auth/logout:
    post:
      summary: Revoke a refresh session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Logged out
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid refresh token
  /wallet:
    get:
      summary: Get the authenticated user's wallet
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Wallet balances
        '401':
          description: Unauthorized
  /wallet/transactions:
    get:
      summary: Get wallet transaction history
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Wallet transactions
        '401':
          description: Unauthorized
  /wallet/reset:
    post:
      summary: Reset virtual wallet balance
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Wallet reset
        '401':
          description: Unauthorized
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: {type: string, minLength: 2, maxLength: 100}
        email: {type: string, format: email}
        password: {type: string, minLength: 8, maxLength: 32, format: password}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}
    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: {type: string}
    SuccessResponse:
      type: object
      required: [success, message]
      properties:
        success: {type: boolean, example: true}
        message: {type: string}
        data: {}
  responses:
    BadRequest:
      description: Invalid request body or validation failure

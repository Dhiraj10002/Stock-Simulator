openapi: 3.0.3
info:
  title: Stock Simulator API
  version: v1
  description: >
    Production-ready REST and WebSocket API specification for the Stock Simulator
    Indian-market paper trading platform. All monetary values are integer paise
    (1 INR = 100 paise) to eliminate floating-point arithmetic errors.
servers:
  - url: /api/v1
    description: Primary API Gateway v1
paths:
  /health:
    get:
      summary: Health Check
      description: Returns API service health status and request correlation ID.
      tags: [System]
      responses:
        '200':
          description: API is available and healthy
          headers:
            X-Request-ID:
              schema: { type: string }
              description: Unique request tracing ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /auth/register:
    post:
      summary: Register User
      description: Creates a new user account and initializes a paper-trading wallet with initial virtual balance.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/login:
    post:
      summary: User Login
      description: Authenticates user credentials and issues an access token and refresh token.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      summary: Refresh Access Token
      description: Rotates the refresh token and issues a new access token and refresh token pair.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      summary: User Logout
      description: Revokes the specified refresh token session.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      summary: Current User Profile
      description: Returns the authenticated user's profile and account identity.
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /wallet:
    get:
      summary: Get Wallet Balances
      description: Returns cash balance and blocked margin in integer paise.
      tags: [Wallet]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User wallet balances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /wallet/transactions:
    get:
      summary: List Wallet Transactions
      description: Returns ledger transaction history (credits, debits, reservations, releases).
      tags: [Wallet]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of wallet transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransactionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /simulation/reset:
    post:
      summary: Reset Simulation
      description: >
        Atomically resets the paper-trading environment: cancels all open orders,
        closes all open positions, restores wallet balance to the default initial virtual cash,
        and logs a permanent SimulationReset audit entry.
      tags: [Simulation]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Simulation reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /orders:
    get:
      summary: List Orders
      description: Returns all orders placed by the authenticated user.
      tags: [Orders]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Place Order
      description: >
        Submits a new market or limit order. Validates trading session hours (09:15-15:30 IST),
        lot size multiples, delivery holdings, available cash, and margin reservations.
      tags: [Orders]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /orders/{id}:
    get:
      summary: Get Order Details
      description: Returns order status and execution details by UUID.
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Order UUID
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreatedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Order not found
    delete:
      summary: Cancel Order
      description: Cancels an open or pending order and immediately releases reserved wallet cash or position shares.
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Order UUID
      responses:
        '200':
          description: Order cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Order cannot be cancelled in current status
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Order not found

  /orders/{id}/execute:
    post:
      summary: Execute Order Trigger
      description: Triggers immediate match and execution of an order against the latest executable quote.
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Order UUID
      responses:
        '200':
          description: Order executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Execution failed (e.g. price unsatisfied, insufficient margin)
        '401':
          $ref: '#/components/responses/Unauthorized'

  /portfolio:
    get:
      summary: Full Portfolio Summary
      description: >
        Returns overall portfolio valuation, invested value, current value, and unrealized/realized P&L.
        Decoupled from 120s execution freshness to allow resilient viewing outside market hours.
      tags: [Portfolio]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Portfolio summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /portfolio/positions:
    get:
      summary: List Portfolio Positions
      description: Returns active open positions across DELIVERY, INTRADAY, and FNO.
      tags: [Portfolio]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active positions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /portfolio/pnl:
    get:
      summary: Portfolio P&L Summary
      description: Returns realized, unrealized, daily, and total profit and loss in integer paise.
      tags: [Portfolio]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: P&L breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioPnlResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /trades:
    get:
      summary: List Executed Trades
      description: Returns trade fill execution logs for the authenticated user.
      tags: [Trades]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of trades
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradesListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /market/quotes/{symbol}:
    get:
      summary: Get Market Quote
      description: Returns the latest cached quote and price for the given symbol from Redis.
      tags: [Market]
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
          example: RELIANCE
      responses:
        '200':
          description: Live quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /market/quotes/{symbol}/history:
    get:
      summary: Get Historical Candles
      description: Returns historical OHLCV candle bars for charting.
      tags: [Market]
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
          example: RELIANCE
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 100 }
          description: Maximum number of candle bars to return
      responses:
        '200':
          description: Candle history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandleHistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /stocks:
    get:
      summary: Search Stocks & Instruments
      description: Searches Angel One instrument master by symbol prefix or company name.
      tags: [Market]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
          description: Search term (e.g. RELIANCE, TCS, INFY)
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /news:
    get:
      summary: List Market News & Sentiment
      description: Returns recent financial RSS news articles with deduplication and lexical sentiment scores.
      tags: [News]
      parameters:
        - name: category
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: News articles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsListResponse'

  /watchlist:
    get:
      summary: List Watchlist
      description: Returns user's saved watchlist symbols.
      tags: [Watchlist]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Watchlist items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Add to Watchlist
      description: Adds a symbol to the authenticated user's watchlist.
      tags: [Watchlist]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol]
              properties:
                symbol: { type: string, example: RELIANCE }
      responses:
        '201':
          description: Watchlist item added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Symbol is already in watchlist

  /watchlist/{symbol}:
    delete:
      summary: Remove from Watchlist
      description: Removes a symbol from user's watchlist.
      tags: [Watchlist]
      security:
        - bearerAuth: []
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
          example: RELIANCE
      responses:
        '200':
          description: Watchlist item removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /ai/analyze-trade:
    post:
      summary: AI Mentor Trade Analysis
      description: Generates educational analysis and risk feedback for simulated trades.
      tags: [AI Mentor]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MentorRequest'
      responses:
        '200':
          description: Educational analysis generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MentorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /ready:
    get:
      summary: Readiness Check
      description: Returns service readiness status for load balancers and orchestrators.
      tags: [System]
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /market/status:
    get:
      summary: Market Feed Status
      description: Returns authoritative feed status, provider info, and whether feed is operating in synthetic mode.
      tags: [Market]
      responses:
        '200':
          description: Feed status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedStatusResponse'

  /market/movers:
    get:
      summary: Market Top Movers
      description: Returns top gainers and top losers sorted by percentage price change.
      tags: [Market]
      responses:
        '200':
          description: Market movers retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketMoversResponse'

  /market/breadth:
    get:
      summary: Market Breadth
      description: Returns overall market breadth advances, declines, and unchanged metrics.
      tags: [Market]
      responses:
        '200':
          description: Market breadth retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketBreadthResponse'

  /fno/option-chain:
    get:
      summary: F&O Option Chain
      description: Returns option chain matrix for an underlying with Black-Scholes Greeks (Delta, Gamma, Theta, Vega) and Implied Volatility.
      tags: [F&O Derivatives]
      parameters:
        - name: underlying
          in: query
          required: true
          schema: { type: string }
          example: NIFTY
        - name: expiry
          in: query
          required: false
          schema: { type: string }
          example: "2026-09-24"
      responses:
        '200':
          description: Option chain data retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptionChainResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /instruments:
    get:
      summary: List Canonical Instruments
      description: Returns paginated search of authoritative NSE/BSE equity and derivative instruments.
      tags: [Instruments]
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
          example: RELIANCE
        - name: exchange
          in: query
          required: false
          schema: { type: string }
          example: NSE
        - name: instrument_type
          in: query
          required: false
          schema: { type: string }
          example: EQUITY
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Instruments retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentsListResponse'

  /instruments/{symbol}:
    get:
      summary: Get Instrument By Symbol
      description: Returns canonical instrument details with all 13 authoritative fields.
      tags: [Instruments]
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
          example: INFY
      responses:
        '200':
          description: Instrument details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentResponse'
        '404':
          description: Instrument not found

  /instruments/sync:
    post:
      summary: Synchronize Instrument Master
      description: Triggers background synchronization of instruments against Angel One official scrip master.
      tags: [Instruments]
      responses:
        '200':
          description: Synchronization started or completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /orders/squareoff-mis:
    post:
      summary: Square Off MIS Positions
      description: Liquidates all open intraday (MIS) positions at prevailing market price.
      tags: [Orders]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: MIS square-off triggered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /orders/history:
    delete:
      summary: Clear Terminal Order History
      description: Clears terminal orders (EXECUTED, CANCELLED, REJECTED) from user's active view while maintaining ledger audit trails.
      tags: [Orders]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Terminal orders cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /trades/{uuid}/journal:
    patch:
      summary: Update Trade Journal
      description: Attaches trader notes, strategy tags, and reflection remarks to an executed trade record.
      tags: [Trades]
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradeJournalRequest'
      responses:
        '200':
          description: Journal updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Trade not found

  /risk/overview:
    get:
      summary: Portfolio Risk Overview
      description: Returns real-time portfolio risk metrics, margin utilization, daily loss limits, and VAR exposure.
      tags: [Risk Management]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Risk overview data retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskOverviewResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /ai/trade-critique:
    post:
      summary: AI Post-Mortem Trade Critique
      description: Generates automated behavioral and execution critique on a completed trade using Gemini AI.
      tags: [AI Mentor]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradeCritiqueRequest'
      responses:
        '200':
          description: Post-mortem critique generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeCritiqueResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /ai/pretrade-check:
    post:
      summary: Pre-Trade Risk & Discipline Check
      description: Evaluates proposed order against circuit limits, risk-reward skew, and user discipline rules prior to submission.
      tags: [AI Mentor]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreTradeCheckRequest'
      responses:
        '200':
          description: Pre-trade risk assessment completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreTradeCheckResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /analytics/performance:
    get:
      summary: Trading Performance Analytics
      description: Institutional performance metrics including win rate, profit factor, max drawdown, Sharpe ratio, and average trade.
      tags: [Analytics]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Performance analytics retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceAnalyticsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /analytics/pnl-calendar:
    get:
      summary: P&L Calendar Heatmap
      description: Daily realized and unrealized P&L records for month/year calendar heatmap visualization.
      tags: [Analytics]
      security:
        - bearerAuth: []
      parameters:
        - name: year
          in: query
          required: false
          schema: { type: integer, example: 2026 }
        - name: month
          in: query
          required: false
          schema: { type: integer, example: 9 }
      responses:
        '200':
          description: Calendar data retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PnlCalendarResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /reports/contract-note:
    get:
      summary: SEBI Compliant Contract Note
      description: Generates institutional contract note with statutory charges breakdown (brokerage, STT, turnover charges, GST, stamp duty).
      tags: [Reports]
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date, example: "2026-09-24" }
      responses:
        '200':
          description: Contract note generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractNoteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /reports/ledger-statement:
    get:
      summary: Financial Ledger Statement
      description: Running ledger statement showing opening cash balance, debit/credit audit transactions, and closing balance.
      tags: [Reports]
      security:
        - bearerAuth: []
      parameters:
        - name: start_date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: end_date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        '200':
          description: Ledger statement generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerStatementResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /ws/market:
    get:
      summary: WebSocket Market Tick Feed
      description: >
        WebSocket connection endpoint for real-time market data streaming and quote updates.
        Connect using `ws://<host>/ws/market` or `wss://<host>/ws/market`.
      tags: [Market]
      responses:
        '101':
          description: Switching Protocols to WebSocket stream

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 100, example: "Dhiraj Sharma" }
        email: { type: string, format: email, example: "trader@example.com" }
        password: { type: string, minLength: 8, maxLength: 32, format: password, example: "SecurePass123!" }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: "trader@example.com" }
        password: { type: string, format: password, example: "SecurePass123!" }

    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    SuccessResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: "Operation completed successfully" }

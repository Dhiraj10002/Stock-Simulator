# ==============================================================================
# Nginx Reverse Proxy Configuration for Oracle VM
# Domain: api.<your-oracle-domain>.com
# Features: SSL Termination, WebSocket Upgrades, Long-lived Stream Timeouts
# ==============================================================================

# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.<your-oracle-domain>.com;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.<your-oracle-domain>.com;

    # SSL certificates (e.g. Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.<your-oracle-domain>.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.<your-oracle-domain>.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # REST API endpoints
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket stream endpoint
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Public health check
    location /health {
        proxy_pass http://backend:8080/api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

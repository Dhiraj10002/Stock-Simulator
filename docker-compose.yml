services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    ports:
      - "8080:8080"
    restart: on-failure

  market-worker:
    build:
      context: ./python-services/market-worker
    env_file:
      - backend/.env
    restart: on-failure

  news-worker:
    build:
      context: ./python-services/news-worker
    env_file:
      - backend/.env
    restart: on-failure

  # The services below only start when explicitly requested via:
  #   docker compose --profile local up
  # They are not started by default so development connects to Neon DEV and Upstash DEV.
  db:
    profiles: ["local"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stock_simulator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stock_simulator"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    profiles: ["local"]
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:


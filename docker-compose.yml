services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stock_simulator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stock_simulator"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/stock_simulator?sslmode=disable
      # Set REDIS_URL in the shell/.env to a rediss:// Upstash TCP URL in production.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  market-worker:
    build:
      context: ./python-services/market-worker
    env_file:
      - backend/.env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DATABASE_URL: postgres://postgres:postgres@db:5432/stock_simulator?sslmode=disable
      MARKET_SYMBOLS: RELIANCE,TCS,INFY,HDFCBANK
      QUOTE_TTL_SECONDS: 300
      HISTORY_TTL_SECONDS: 86400
      HISTORY_MAX_ITEMS: 500
      MARKET_FEED_STALE_SECONDS: 120
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  news-worker:
    build:
      context: ./python-services/news-worker
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      NEWS_POLL_INTERVAL_SECONDS: 600
      NEWS_TTL_SECONDS: 604800
      NEWS_SEEN_TTL_SECONDS: 604800
      NEWS_MAX_ITEMS: 200
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

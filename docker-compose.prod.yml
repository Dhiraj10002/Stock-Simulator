# ==============================================================================
# Oracle Cloud Infrastructure (OCI) Production Docker Compose Stack
# Architecture: Vercel Frontend + Oracle Backend Stack
#
# Frontend is hosted on Vercel: https://<your-vercel-app>.vercel.app
# Backend & Workers are hosted on Oracle via this Compose configuration:
#   Public Endpoint: https://api.<your-oracle-domain>.com/api/v1
#   WebSocket Endpoint: wss://api.<your-oracle-domain>.com/ws/market
# ==============================================================================

services:
  # Internal Redis 7 (In-Memory PubSub & Quotes Cache)
  # Port 6379 is NOT exposed to public internet for security.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis_prod_data:/data
    networks:
      - stock_sim_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  # Authoritative Go Core Backend Service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
      - path: backend/.env
        required: false
    environment:
      - APP_ENV=production
      - REDIS_URL=redis://redis:6379/0
      - MARKET_WORKER_URL=http://market-worker:8085
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required in production (e.g. https://<your-vercel-app>.vercel.app)}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required in production}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required in production}
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - stock_sim_net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # Uses native compiled /healthcheck binary inside distroless container (no wget/shell needed)
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Market Data Worker (Institutional Angel One Feed / Fallback Engine)
  market-worker:
    build:
      context: ./python-services/market-worker
    env_file:
      - path: .env
        required: false
      - path: backend/.env
        required: false
    environment:
      - REDIS_URL=redis://redis:6379/0
      - QUOTE_SERVER_HOST=0.0.0.0
      - QUOTE_SERVER_PORT=8085
      - SYMBOL_ALIASES_FILE=/app/symbol_aliases.json
    expose:
      - "8085"
    restart: unless-stopped
    networks:
      - stock_sim_net
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8085/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Financial News & Sentiment Worker
  news-worker:
    build:
      context: ./python-services/news-worker
    env_file:
      - path: .env
        required: false
      - path: backend/.env
        required: false
    environment:
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped
    networks:
      - stock_sim_net
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  # Optional: Self-contained frontend container for staging/local-prod verification
  # (In production, frontend is deployed directly to Vercel)
  frontend:
    profiles: ["with-frontend"]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080/ws/market}
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8080/ws/market}
    restart: unless-stopped
    networks:
      - stock_sim_net
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis_prod_data:

networks:
  stock_sim_net:
    driver: bridge

# ==============================================================================
# Oracle Cloud Infrastructure (OCI) Production Docker Compose Stack
# Architecture: Vercel Frontend + Oracle Backend Stack
#
# Frontend is hosted on Vercel: https://<your-vercel-app>.vercel.app
# Backend & Workers are hosted on Oracle via this Compose configuration:
#   Public Endpoint: https://api.<your-oracle-domain>.com/api/v1
#   WebSocket Endpoint: wss://api.<your-oracle-domain>.com/ws/market
# ==============================================================================

x-runtime-logging: &runtime-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # The only public service. DNS for API_DOMAIN must point to this VM.
  caddy:
    image: caddy:2-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required (e.g. api.example.com)}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required for certificate registration}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/oracle/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging: *runtime-logging
    networks:
      gateway_net:
        ipv4_address: ${CADDY_INTERNAL_IP:-172.30.250.2}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Internal Redis 7 (In-Memory PubSub & Quotes Cache)
  # Port 6379 is NOT exposed to public internet for security.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    logging: *runtime-logging
    volumes:
      - redis_prod_data:/data
    networks:
      - stock_sim_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  # Authoritative Go Core Backend Service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: ${PRODUCTION_ENV_FILE:-.env}
        required: true
    environment:
      - APP_ENV=production
      - GIN_MODE=release
      - PORT=8080
      - TRUSTED_PROXIES=${CADDY_INTERNAL_IP:-172.30.250.2}
      - REDIS_URL=redis://redis:6379/0
      - MARKET_WORKER_URL=http://market-worker:8085
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required in production (e.g. https://stock-simulator-dev.vercel.app)}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required in production}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required in production}
      - FRONTEND_PROXY_SECRET=${FRONTEND_PROXY_SECRET:-}
      - MARKET_FEED_MODE=${MARKET_FEED_MODE:-live}
      - INDIAN_API_KEY=${INDIAN_API_KEY:-}
      - INDIAN_API_PLAN=${INDIAN_API_PLAN:-free}
    expose:
      - "8080"
    restart: unless-stopped
    logging: *runtime-logging
    networks:
      - stock_sim_net
      - gateway_net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # Uses native compiled /healthcheck binary inside distroless container (no wget/shell needed)
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Market Data Worker (Institutional Angel One Feed / Fallback Engine)
  market-worker:
    build:
      context: ./python-services/market-worker
    env_file:
      - path: ${PRODUCTION_ENV_FILE:-.env}
        required: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - QUOTE_SERVER_HOST=0.0.0.0
      - QUOTE_SERVER_PORT=8085
      - SYMBOL_ALIASES_FILE=/app/symbol_aliases.json
      - MARKET_FEED_MODE=${MARKET_FEED_MODE:-live}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required in production}
      - INSTRUMENT_REFRESH_SECONDS=${INSTRUMENT_REFRESH_SECONDS:-60}
      - MARKET_STATUS_URL=http://backend:8080/api/v1/market/status
      - HTTP_PROXY=${BROKER_HTTP_PROXY:-}
      - HTTPS_PROXY=${BROKER_HTTPS_PROXY:-}
      - NO_PROXY=backend,redis,localhost,127.0.0.1
    expose:
      - "8085"
    restart: unless-stopped
    logging: *runtime-logging
    networks:
      - stock_sim_net
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8085/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Optional supervised HTTP CONNECT proxy. Enable only after verifying its egress.
  broker-proxy:
    profiles: ["broker-proxy"]
    build:
      context: ./deploy/oracle/broker-proxy
    volumes:
      - ./deploy/oracle/broker-proxy/config:/etc/privoxy/config:ro
    expose:
      - "8118"
    restart: unless-stopped
    logging: *runtime-logging
    networks:
      - stock_sim_net
    healthcheck:
      test: ["CMD", "curl", "--head", "--silent", "--show-error", "--max-time", "8", "--proxy", "http://127.0.0.1:8118", "https://smartapisocket.angelone.in/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Financial News & Sentiment Worker
  news-worker:
    build:
      context: ./python-services/news-worker
    env_file:
      - path: ${PRODUCTION_ENV_FILE:-.env}
        required: true
    environment:
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped
    logging: *runtime-logging
    networks:
      - stock_sim_net
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  # Optional: Self-contained frontend container for staging/local-prod verification
  # (In production, frontend is deployed directly to Vercel)
  frontend:
    profiles: ["with-frontend"]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://${API_DOMAIN}/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://${API_DOMAIN}/ws/market}
        NEXT_PUBLIC_ENABLE_SPEED_INSIGHTS: ${NEXT_PUBLIC_ENABLE_SPEED_INSIGHTS:-false}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - BACKEND_API_URL=${BACKEND_API_URL:-https://${API_DOMAIN}/api/v1}
      - BACKEND_PROXY_SECRET=${FRONTEND_PROXY_SECRET:-}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://${API_DOMAIN}/api/v1}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-wss://${API_DOMAIN}/ws/market}
    restart: unless-stopped
    logging: *runtime-logging
    networks:
      - stock_sim_net
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis_prod_data:
  caddy_data:
  caddy_config:

networks:
  stock_sim_net:
    driver: bridge
  # A separate bridge lets Go trust only Caddy, rather than all workers.
  # Change the subnet, dynamic range and Caddy IP together if they overlap another network.
  gateway_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${GATEWAY_SUBNET:-172.30.250.0/29}
          # Reserve .2 for Caddy even when Go starts first. Dynamic allocation
          # must not consume the gateway address before Caddy joins the bridge.
          ip_range: ${GATEWAY_DYNAMIC_RANGE:-172.30.250.4/30}
